[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhcgnomes"
dynamic = ["version"]
description = "Python library for parsing MHC nomenclature in the wild"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Alex Rubinsteyn", email = "alex.rubinsteyn@unc.edu"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=5.4",
    "argcomplete>=3",
    "pandas>=3,<4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    # Keep pinned in lockstep with .pre-commit-config.yaml so local ./lint.sh,
    # CI, and pre-commit run the same Ruff ruleset (#259).
    "ruff==0.16.10",
    "pre-commit",
    "coveralls",
    # pandas reads the IPD-IMGT/HLA Dictionary through openpyxl. Needed so
    # tests/test_serotype_generation.py can check that the shipped serotype
    # table still matches its source, rather than skipping in CI (#156).
    "openpyxl",
    # tests/test_missing_input.py checks numpy missing-value scalars and arrays.
    # The package itself does not import numpy.
    "numpy>=2,<3",
]
docs = [
    "mkdocs>=1.6",
]

[project.urls]
Homepage = "https://github.com/pirl-unc/mhcgnomes"
Repository = "https://github.com/pirl-unc/mhcgnomes"
Documentation = "https://pirl-unc.github.io/mhcgnomes/"

[project.scripts]
mhcgnomes = "mhcgnomes.cli:main"

[tool.setuptools.dynamic]
version = {attr = "mhcgnomes.version.__version__"}

[tool.setuptools]
packages = ["mhcgnomes", "mhcgnomes.data"]

[tool.setuptools.package-data]
"mhcgnomes.data" = [
    "allele_aliases.yaml",
    "current_allele_names.yaml",
    "evidenced_prefix_aliases.yaml",
    "external_sources.json",
    "first_allele_field_widths.yaml",
    "gene_aliases.yaml",
    "haplotypes.yaml",
    "heterodimers.yaml",
    "ipd_record_annotations.json",
    "known_alleles.yaml",
    "registry_allele_identities.json",
    "serotype_splits.yaml",
    "serotypes.yaml",
    "single_field_alleles.yaml",
    "species.yaml",
    "species_taxonomy.yaml",
    "supertypes.yaml",
    "underrepresented_taxa_source_registry.yaml",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["mhcgnomes", "tests"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".eggs",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip() without explicit strict
    "SIM108", # use ternary operator instead of if-else
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "RUF012"]  # allow assert False and class-level test data
"tests/generate_*.py" = ["UP031"]  # generator scripts
"tests/timing.py" = ["UP031", "E741"]  # timing script
"__init__.py" = ["F401"]  # allow unused imports in __init__.py
"mhcgnomes/data/*" = ["UP031"]  # data processing scripts

[tool.ruff.lint.isort]
known-first-party = ["mhcgnomes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["mhcgnomes"]
omit = ["mhcgnomes/version.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
