      - MICA
      - MICB
      - BTN3A1
    Id:
      - CD1a
      - CD1b
      - CD1c
      - CD1d
      - CD1e
      - MR1
    I:
      # pseudogenes
      - H
      - J
      - K
      - L
      - P
      - V
