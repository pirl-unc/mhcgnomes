# MHC class definitions:
#
# Ia: associates with B2M, presents peptides
# Ib: "non-classical", located in chr6 MHC locus, associates with B2M
# Ic: related genes in MHC locus, doesn't associate with B2M (e.g. MICA)
# Id: genes related to Class I MHC in other loci / on other chromosomes
#
# IIa: alpha/beta protein chains which present peptides
# IIb: accessory or non-classical class II MHC proteins
#
# If unsure which sub-class a gene belongs to, use just "I" or "II"
# Some non-MHC genes involved in antigen processing are also included
# below, such as TAP1/2. Group these under "other".
#
# Source for MHC Id genes across different species:
# - https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5002277/
#
# ============================================================================
# Taxonomic root nodes
#
# These define shared MHC gene names at higher taxonomic levels.
# Species inherit genes from their parent node (set via "parent:" field).
# The inheritance chain is walked recursively, so a species can inherit
# through multiple levels (e.g., Salmo salar → Salmonidae sp.).
#
# Common genes in common_genes.yaml (DMA, DMB, TAP1, TAP2, TAPBP, B2M,
# MHCIIB) are additionally accepted for ALL species as a last resort,
# independent of the tree.
# ============================================================================

######################################################
#
# Galliformes — shared galliform MHC genes
#
# The B-complex (BF class I, BLB class II) nomenclature is specific to
# galliform birds (chicken, turkey, quail, pheasant, grouse).
#
# Sources:
# - https://www.ebi.ac.uk/ipd/mhc/group/CHICKEN/
# - https://link.springer.com/article/10.1007/s00251-019-01145-6
#
######################################################
Galliformes sp.:
  prefix: Gall
  name: Galliform bird
  genes:
    Ia:
      - BF
    IIa:
      BL:
        - BLB
    IIb:
      DM:
        - DMA
        - DMB1
        - DMB2
    other:
      - TAP1
      - TAP2
      - TAPBP
      - B2M
######################################################
#
# Crocodylia — shared crocodilian MHC genes
#
# U-lineage class I and DB-series class II beta genes are shared
# across all Crocodylia (Jaratlerdsiri et al. 2014).
#
# Sources:
# - https://pubmed.ncbi.nlm.nih.gov/24253731/
# - https://pubmed.ncbi.nlm.nih.gov/22864956/
#
######################################################
Crocodylia sp.:
  prefix: Croc
  name: Crocodilian
  genes:
    I:
      - UA
    IIa:
      DB:
        - DB01
        - DB02
        - DB03
        - DB04
        - DB05
        - DB06
        - DB07
        - DB08

