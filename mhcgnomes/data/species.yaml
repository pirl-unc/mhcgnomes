# MHC class definitions:
#
# Ia: associates with B2M, presents peptides
# Ib: "non-classical", located in chr6 MHC locus, associates with B2M
# Ic: related genes in MHC locus, doesn't associate with B2M (e.g. MICA)
# Id: genes related to Class I MHC in other loci / on other chromosomes
#
# IIa: alpha/beta protein chains which present peptides
# IIb: accessory or non-classical class II MHC proteins
#
# If unsure which sub-class a gene belongs to, use just "I" or "II"
# Some non-MHC genes involved in antigen processing are also included
# below, such as TAP1/2. Group these under "other".
#
# Source for MHC Id genes across different species:
# - https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5002277/
#
# ============================================================================
# Taxonomic hierarchy
#
# Species inherit genes from their parent node (set via "parent:" field).
# Entries without an explicit parent default to Gnathostomata sp. (the root).
# The inheritance chain is walked recursively:
#
#   Gnathostomata sp.  (DMA, DMB, DM, TAP1, TAP2, TAP-L, TAPBP, B2M)
#   ├── Chondrichthyes sp.   (+ UA, DA, DB, DC)
#   │   └── sharks
#   ├── Actinopterygii sp.   (+ UAA, UBA, UA, UCA, UDA, DA, DB, DC, DX)
#   │   ├── Salmonidae sp.
#   │   └── bony fish
#   ├── Amphibia sp.         (+ UAA, UBA, UA, UCA, UDA, DA, DB, DC)
#   │   └── frogs, salamanders, caecilians
#   ├── Reptilia sp.         (+ UAA, UBA, UA, UCA, UDA, DA, DB, DC, DRA)
#   │   ├── Testudines sp.
#   │   ├── Crocodylia sp.   (+ DB01-DB55)
#   │   └── lizards, snakes, tuatara
#   ├── Aves sp.             (+ UAA, UBA, UA, DA, DB, DC, DRA, DRB)
#   │   ├── Galliformes sp.  (+ BF, BLB, DMB1/2)
#   │   └── all birds
#   ├── Marsupialia sp.      (+ UA, DA, DB, DC, DRA)
#   │   └── marsupials
#   └── ...all jawed vertebrate entries descend from this root
#
# ============================================================================

######################################################
# Root: all jawed vertebrates with adaptive immunity
######################################################
Gnathostomata sp.:
  prefix: Gnathostomata
  name: Jawed vertebrate
  genes:
    Id:
      # MR1 presents microbial vitamin B metabolites to MAIT cells.
      # Conserved across jawed vertebrates with consistent naming.
      - MR1
    IIb:
      DM:
        - DMA
        - DMB
    other:
      - TAP1
      - TAP2
      - TAP-L
      - TAPBP
      - B2M


