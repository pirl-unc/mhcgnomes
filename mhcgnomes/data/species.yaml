        - DRA
        - DRB1
        - DRB3
        - DRB4
        - DRB5
      DP:
        - DPA1
        - DPB1
      DQ:
        - DQA1
        - DQA2
        - DQB1
        - DQB2
    IIb:
      DO:
        - DOA
