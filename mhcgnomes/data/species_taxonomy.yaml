# Verified NCBI Taxonomy IDs and vertebrate clades for every entry in species.yaml.
#
# Source: NCBI Taxonomy dump (https://ftp.ncbi.nlm.nih.gov/pub/taxonomy/taxdump.tar.gz)
# Issue: https://github.com/pirl-unc/mhcgnomes/issues/276
#
# Clades are derived deterministically from the verified NCBI Taxonomy lineage
# (most specific rule first):
#   human:            Homo sapiens (9606)
#   nhp:              Primates (9443) excluding Homo sapiens and Primata sp.; plus NHP
#   murine:           Murinae (39107)
#   cetacean:         Cetacea (9721)
#   ungulate:         non-cetacean Artiodactyla (91561) and Perissodactyla (9787)
#   carnivore:        Carnivora (33554)
#   bat:              Chiroptera (9397)
#   marsupial:        Metatheria / Marsupialia (9263)
#   monotreme:        Monotremata (9255)
#   other_mammal:     remaining Mammalia (40674)
#   bird:             Aves (8782)
#   reptile:          Lepidosauria (8504), Testudines (8459), Crocodylia (1294634); plus Reptilia sp.
#   amphibian:        Amphibia (8292)
#   bony_fish:        Actinopterygii (7898)
#   lobe_finned_fish: Coelacanthimorpha (118072), Dipnomorpha (7878)
#   shark_ray:        Chondrichthyes (7777)
#   jawless_fish:     Cyclostomata (1476529) / Myxini (117565)
#   null:             multi-clade taxonomic nodes (Gnathostomata sp., Primata sp., Rodentia sp.)
#
# Entries with ncbi_taxid: null are paraphyletic groupings not represented as a single
# NCBI taxon (NHP, Reptilia sp.).
