# Common MHC gene names accepted for any vertebrate species
#
# IMPORTANT: Only genes that are genuinely universal across vertebrates
# belong here. Taxon-specific gene naming systems must be defined
# per-species in species.yaml:
#
#   - U-lineage (UA, UAA, UBA, etc.): fish, amphibians, reptiles, some birds
#   - DR/DQ/DP system (DRA, DRB1, etc.): mammals only
#   - BF/BLB system: galliform birds only
#   - DA-series (DAA, DAB): fish, amphibians, reptiles, birds (not mammals)
#
# These genes are conserved across all jawed vertebrates and safe to
# accept for any species:

# Non-classical class II (antigen processing)
class_II_alpha:
  - DMA

# Note: only family-level names here, not numbered variants.
# Species that need DMB1/DMB2 define them specifically in species.yaml.
# This avoids bypassing species-specific aliases (e.g., if a species
# maps DMB → DMB1, the common gene shouldn't offer bare DMB).
class_II_beta:
  - DMB
  # MHCIIB is a generic "MHC class II beta" label used across many
  # non-mammalian species (birds, reptiles, amphibians, fish).
  - MHCIIB

# Antigen processing / transport genes
other:
  - TAP1
  - TAP2
  - TAPBP
  - B2M
