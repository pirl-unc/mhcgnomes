# Vertebrate-wide MHC gene names
#
# These genes appear across fish, amphibians, reptiles, birds, and mammals.
# Any vertebrate species in the ontology should accept these gene names,
# even if the species doesn't explicitly list them in species.yaml.
#
# This enables mhcseqs (and other callers) to pass a gene name like "DAB"
# with a default_species and have it parse, without requiring every species
# to individually list every standard MHC gene.
#
# Sources: mhcseqs v0.9.0 analysis of 1,610 unique gene+organism pairs
# from UniProt, cross-referenced against the comparative MHC literature.

# Class I alpha chain genes (U-lineage and classical)
# Note: single-letter genes (A, B, F) are excluded because they conflict
# with haplotype names (H2-a, H2-b) and serotypes (BoLA-A11). These
# must be defined per-species in species.yaml.
class_I:
  - UA
  - UAA
  - UBA
  - UCA
  - UDA
  - UEA
  - UGA
  - UHA
  - UMA
  - ULA
  - BF

# Class II alpha chain genes
class_II_alpha:
  - DAA
  - DRA
  - DBA
  - DMA

# Class II beta chain genes
class_II_beta:
  - DAB
  - DAB1
  - DAB2
  - DRB
  - DRB1
  - DBB
  - DXB
  - DMB
  - DMB1
  - DMB2
  - MHCIIB

# Antigen processing genes
other:
  - TAP1
  - TAP2
  - TAPBP
  - B2M
