  # Rat (Rattus norvegicus) RT1 haplotypes.
  #
  # Sources (read verbatim from primary papers & GenBank records):
  # - Class II (RT1-Ba, RT1-Bb, RT1-Da, RT1-Db1) for a, b, c, d, k, l, n, u:
  #   PMID 15517241 (Immunogenetics 2004;56:587-594), GenBank AY626180-AY626219
  #   (strains ACI [a], BUF [b], PVG [c], BDIX [d], SHR [k], LEW/F344 [l],
  #   BN [n], WF/BB [u]). Note: GenBank uses /gene="RT1-Db" for RT1-Db1.
  # - Class II & haplotype mapping for av1 (DA: A=a, B=a, D=a), f (DA.1F),
  #   h (DA.1H), u (DA.1U):
  #   Tuncel et al. 2014 (PLoS Genet 10:e1004151, PMID 24586191, PMC3930506),
  #   Table 1 & GenBank KC222932-KC222951.
  # - Class Ia (RT1-A1/A2/A3):
  #   Joly et al. 1996 (J Immunol 157:1551, PMID 8759738: single A1 in a, l, u;
  #   two loci A1c/A2c in c, GenBank X90370-X90371, X82106);
  #   Walter & Günther 2000 (Immunogenetics 51:829, PMID 10970097) & Hurt et al.
  #   2004 (Genome Res 14:631, PMID 15060004, PMC383307: three loci A1n/A2n/A3n
  #   in BN RT1^n, GenBank X90375, X90376, AJ277139);
  #   Joly et al. 2003 (J Immunol 171:1857, PMID 12817008: three loci A1o/A2o/A3o
  #   in RT1^o, GenBank X90372-X90373);
  #   UniProt Q31257 (RT1.A1(f)).
