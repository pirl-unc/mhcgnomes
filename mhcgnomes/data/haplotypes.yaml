#########################################
# Swine (SLA) MHC haplotypes
#
# Naming. The ISAG/IUIS-VIC SLA Nomenclature Committee gives swine haplotypes
# their own prefix, separate from the SLA- used for genes and alleles, and two
# series of it: `Hp-` for high-resolution haplotypes, defined by sequenced
# alleles, and `Lr-` for low-resolution ones, defined by PCR-SSP allele groups.
# The number is <class I>.<class II>, so a class I haplotype ends in ".0" and a
# class II one begins with "0." -- Hp-04.0 and Hp-0.03 are the two halves of
# the NIH/MGH minipig's type, not variants of one thing.
#
# Both facts are stated in Reiner et al. 2024 (PMC10925748, Göttingen Minipig
# SLA diversity): "SLA class I ... and class II ... genes were characterized by
# PCR-based low-resolution (Lr) haplotyping. Criteria and nomenclature used for
# SLA haplotyping were proposed by the ISAG/IUIS-VIC SLA Nomenclature
# Committee", alongside class I types Lr-24.0 and Hp-55.0 and class II types
# Lr-0.21 and Hp-0.03.
#
# The prefix lives in the haplotype names below rather than in a per-species
# key: "Hp-1a.0" and "SLA-Hp-1a.0" both parse, and a `haplotype prefix` field
# would only restate what the names already carry. That answers the open
# question in #143; #139 removed the key that asserted it with nothing behind
# it.
#
# Contents. The nine high-resolution class I haplotypes below are the ones
# designated by the SLA Nomenclature Committee, as tabulated under "Known
# haplotypes" in Table 2 of Bækbo et al. 2017
# (https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5472656/), whose columns run
# Hp- | SLA-1 | SLA-3 | SLA-2. The same table's second half proposes
# haplotypes A.0 through Z.0 from that study alone; those are the authors'
# suggestions rather than committee designations, and several rest on
# unnamed sequences (NS#5, HB01), so they are deliberately not listed here.
##########################################
SLA:
  # Large White. Table 2: SLA-1*0101, SLA-3*0101, SLA-2*0101.
  Hp-1a.0:
    - 1*01:01
    - 3*01:01
    - 2*01:01
  # NIH, Sinclair and Hanford minipigs. Table 2 gives two SLA-1 alleles for
  # this haplotype, "0201(a), 0701(b)", and *null* for SLA-3 -- the locus is
  # absent, not unknown. The third allele here used to read SLA-3*02:01, which
  # is the SLA-2 column misfiled under SLA-3.
  #
  # "3*Blank" is how that null is written. Omitting SLA-3 would record it as a
  # locus nobody typed, which is a different claim from one the source says is
  # not there. Reachable as Haplotype.absent_genes. See #162.
  Hp-2.0:
    - 1*02:01
    - 1*07:01
    - 2*02:01
    - 3*Blank
  # Yucatan miniature pigs; the most prevalent class I haplotype in Danish
  # commercial pigs by its low-resolution counterpart Lr-4.0.
  Hp-4b.0:
    - 1*04:01
    - 3*04:01
    - 2*04:02:01
  # Yucatan and Microminipig.
  Hp-6.0:
    - 1*08:05
    - 3*06:01
    - 2*05:04
  # Yucatan.
  Hp-7.0:
    - 1*08:01
    - 3*07:01:01
    - 2*05:02
  # Clawn and Microminipig.
  Hp-17.0:
    - 1*08:04
    - 3*03:05
    - 2*06:03
  # Landrace. Two SLA-1 alleles again, "0901(a), 1501(b)".
  Hp-28.0:
    - 1*09:01
    - 1*15:01
    - 3*07:01:02
    - 2*05:03
  # CMAH/Gal knockout pigs.
  Hp-32.0:
    - 1*07:02
    - 3*04:02
    - 2*02:02
  # Landrace. Table 2 gives SLA-3 as "04hb06", a provisional designation rather
  # than a committee-assigned allele name, so only the two named alleles are
  # listed.
  Hp-62.0:
    - 1*14:01
    - 2*06:02

  ##########################################################################
  # Low-resolution (Lr-) haplotypes
  #
  # The other half of the ISAG/IUIS-VIC scheme: Lr- types are defined by
  # PCR-SSP allele *groups* rather than by sequenced alleles, so a member here
  # is a one-field allele -- "1*04" is SLA-1*04XX, any allele in group 04.
  #
  # Sources (read verbatim from Europe PMC full-text XML and supplementary files):
  #   * Hammer et al., "Comparative analysis of swine leukocyte antigen gene
  #     diversity in European farmed pigs", Animal Genetics 2021;52:523
  #     (PMID 34028065, PMC8362188), Tables 1 & 2 and Table S2b.
  #   * Hammer et al., "Comparative analysis of swine leukocyte antigen gene
  #     diversity in Göttingen Minipigs", Front Immunol 2024;15:1360022
  #     (PMID 38469309, PMC10925748), Abstract, Tables 1-3, and Supplementary
  #     Tables 3 & 4 (DataSheet_1.docx).
  #   * de León et al. (senior author S.E. Hammer), "Association of Porcine
  #     Swine Leukocyte Antigen (SLA) Haplotypes with B- and T-Cell Immune
  #     Response to Foot-and-Mouth Disease Virus (FMDV) Peptides", Vaccines
  #     2020;8:E513 (PMID 32911818, PMC7563261), Table 5 & Discussion.
  #   * Techakriengkrai et al., "Diversity of the Swine Leukocyte Antigen Class
  #     I and II in Commercial Pig Populations", Front Vet Sci 2021;8:637682
  #     (PMID 33996967, PMC8121083), Tables 2-4 (used for class II, where the
  #     primer panel is complete and agrees 20/20 with PMC8362188, and as
  #     corroboration for Lr-17.0; class I rows unique to PMC8121083 are NOT
  #     imported because Table 1 footnote * notes its class I primer panel
  #     cannot detect SLA-1*03/*15, SLA-2*16, or SLA-3*02 and Table 2 drops the
  #     second SLA-1 allele on duplicated haplotypes Lr-2.0, 27.0, 28.0, 35.0).
  #   * Choi et al., Asian-Australas J Anim Sci 2016;29:169 (PMID 26950861,
  #     PMC4811781), Table 1; Ando et al., Cells 2019;8:E783 (PMID 31357541,
  #     PMC6721486), Table 1 (corroboration for Lr-0.11; Lr-0.16, 0.18, 0.37
  #     are omitted because PMC6721486 did not type DQA).
  #
  # Several distinctions the primary tables draw that this curation preserves:
  #
  #   * "Blank" / "Null" vs untyped "Blank": in PMC8362188 Table 1, footnote 5
  #     marks Lr-24.0 and Lr-33.0 SLA-1 as "Untyped SLA class I locus" (and fn 4
  #     of Table 2 marks Lr-0.29 DRB1 as untyped), so those stay out; plain
  #     "Blank" in PMC8362188 and explicit "Null" in PMC10925748 (Lr-03.0 SLA-1,
  #     tabulated separately from Blank in Table 3) are recorded as "<gene>*Blank"
  #     (#162). Lr-0.17 ("Blank or Null" for DQA in PMC10925748) stays out.
  #   * Parenthetical refinements such as "04XX (04:04)" or same-group slashes
  #     such as "09XX/09:06" (Lr-0.11, Lr-0.27) both assert the allele group
  #     (04, 09); that group is what the low-resolution haplotype records.
  #   * DQA "04XX+05XX" (Lr-0.21, Lr-0.25, Lr-0.27): PMC8362188 Table 2 fn 3
  #     ("Positive with both DQA*04XX primer sets in lanes D12 and C12", Table
  #     S2b), PMC4811781 Table 1 ("04XX+w05XX" weak cross-band), PMC10925748
  #     Abstract ("Lr-0.21 (DRB1*01XX-DQB1*05XX-DQA*04XX)"), and PMC7563261
  #     Table 5 & Discussion (explicitly naming DQA*04XX for both Lr-0.21 and
  #     Lr-0.27) establish that the allele group at DQA is DQA*04.
  #   * Alphabetical suffixes (0.08b, 0.15a/b, 0.19a/b): PMC8362188 Table 2 fn 2
  #     explains these distinguish closely related haplotypes with *identical*
  #     low-resolution group specificities. The base low-resolution haplotypes
  #     Lr-0.08, Lr-0.15, and Lr-0.19 (also tabulated without suffixes in
  #     PMC8121083 Table 4) are curated; the sub-lettered names remain out.
  #
  # Rows deliberately absent, each for a stated reason:
  #
  #   composite or unconfirmed name   01.0/04.0, 16.0 mod, 31.0/63.0,
  #                                   0.08b, 0.15a, 0.15b, 0.19a, 0.19b,
  #                                   GMP-1.0/2.0/3.0, YDLR-2.0, Pie-0.1
  #   untyped or ambiguous Blank/Null 24.0, 33.0, 0.17, 0.29
  #   class I "+" -- not defined      38.0, 45.0
  #   cross-group "/" disjunction     52.0, 53.0
  #   incomplete primer set / no DQA  50.0, 63.0, 70.0, 76.0, 80.0, 81.0, 82.0,
  #                                   0.16, 0.18, 0.37
