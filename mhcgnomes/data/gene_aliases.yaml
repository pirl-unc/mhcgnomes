# Taxonomy reclassification aliases are handled via "other prefixes" in
# species.yaml (e.g. Brre → Dare, Trsi → Pesi). The gene_aliases.yaml
# file does not need entries for these.
Coja:
  # Paper-local II-xx numbered class II labels from quail MHC studies.
  # II-01 through II-07 map sequentially to the 7 canonical beta loci.
  # II-13, II-16, II-17 remain unmapped (registry holdback).
  II-01: DAB1
  II-02: DBB1
  II-03: DCB1
  II-04: DDB1
  II-05: DEB1
  II-06: DFB1
  II-07: DGB1
  # Bare "C" → C1 (primary C-series class I locus)
  C: C1
Zhom:
  # Old-genus Rhacophorus prefix preserved in external gene name
  Rhom-beta1: DAB
Xetr:
  hla-drb1: DRB1
Paol:
  # Numbered DAB lineage variants seen in mhcseqs, collapsed to family-level DAB
  DAB1: DAB
