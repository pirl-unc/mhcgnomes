# Species designations published by IPD-MHC, read verbatim from the group
# species tables rather than from a summary.
#
# This is a non-runtime curation file, like
# underrepresented_taxa_source_registry.yaml: nothing loads it at import, and
# tests/test_ipd_designations.py checks the runtime ontology against it.
#
# What it is for. mhcgnomes generates a prefix for any species without a
# curated one, guarded only by uniqueness within this repo, so it has no
# knowledge of the IPD-MHC namespace (#112). This file is that namespace, for
# the groups checked so far, and the test turns "discovered by sweep" into
# "fails in CI".
#
# The check allows exactly two outcomes per row:
#   1. our prefix for that species IS the IPD code, or
#   2. the code is listed under "context only prefixes" on our entry, because
#      another species holds it in published use -- the Caau and Hyam cases.
# Anything else is a disagreement nobody has looked at.
#
# All eleven IPD-MHC groups are transcribed here -- BoLA, CeLA, CHICKEN, CLA,
# DLA, ELA, FISH, NHP, OLA, RT1, SLA -- read from the group species tables
# rather than a fetch summary. 125 rows. The eight groups that were here before
# were re-read at the same time and every row still agreed, code for code.
#
# Where a row's parentheses carry two codes the first is the species
# designation and the second is usually the group label ("Canis lupus
# (Calu,DLA)"); only the species code is recorded.


BoLA:
  name: Cattle and buffalo
  url: https://www.ebi.ac.uk/ipd/mhc/group/BoLA/species
  species:
    Bos frontalis: Bofr
    Bos grunniens: Bogr
    # The group node itself: IPD files cattle under "Bos sp. (BoLA)" and has no
    # separate row for Bos taurus or Bos indicus, so their two-plus-two codes
    # are ours rather than designations. See #131.
    Bos sp.: BoLA
    Bubalus bubalis: Bubu

