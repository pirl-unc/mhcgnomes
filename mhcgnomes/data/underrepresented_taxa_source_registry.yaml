schema_version: 1
description: >
  Source registry for planned MHC expansion in underrepresented taxa. This file
  is not yet loaded by runtime code; it is a curation ledger for ontology work.
placement_rule: >
  Put information here when it is source-backed and useful but not stable enough
  to canonize in runtime files like species.yaml, gene_aliases.yaml, or
  allele_aliases.yaml.

capture_statuses:
  runtime_ready: >
    Ready for inclusion in runtime ontology files such as species.yaml.
  partial_capture_only: >
    Valuable source-backed information exists, but it should remain in this
    registry until nomenclature and scope are stable enough for runtime use.

confidence_levels:
  high_gene_level: >
    Safe for species and gene-level ontology. Not automatically safe for
    canonical allele ingestion.
  medium_genome_backed: >
    Safe for species plus genome-backed gene-family aliases with provenance.
  low_alias_only: >
    Useful for literature aliases and planning, but not safe as canonical
    allele ontology without extra curation.

taxa:
  Xela:
    scientific_name: Xenopus laevis
    clade: frog
    ontology_status: existing
    curation_status: active
    ingest_confidence: high_gene_level
    recommended_ingest_level: gene
    taxonomy_sources:
      - https://amphibiansoftheworld.amnh.org/
    structured_sources:
      - https://www.xenbase.org/
      - https://www.ncbi.nlm.nih.gov/datasets/
    literature_sources:
      - https://pubmed.ncbi.nlm.nih.gov/28695290/
    canonical_gene_candidates:
      - UAA
      - UBA
      - UCA
      - UDA
      - UEA
      - DAA
      - DAB
      - DMA
      - TAP1
      - TAP2
      - TAPBP
      - B2M
    observed_structure:
      - runtime_addition: class Ia UAA and UBA, class Ib UCA/UDA/UEA, class IIa DA family, class IIb DMA
      - xenbase_nomenclature: mhc1-uaa, mhc1-uba*, mhc1-uca, mhc1-uda, mhc1-uea, mhc2-daa, mhc2-dab, mhc2-dma
      - tetraploid_note: X. laevis has L and S homeologs for many MHC genes
    notes: >
      Expanded from original UAA-only baseline to full Xenbase-backed gene
      coverage. Class I uses UA/UB/UC/UD/UE family structure; class II uses
      DA and DM families. Antigen processing genes retained from original entry.

  Xetr:
    scientific_name: Xenopus tropicalis
    clade: frog
    ontology_status: gene_level_expanded
    curation_status: active
    ingest_confidence: high_gene_level
    recommended_ingest_level: gene
    taxonomy_sources:
      - https://amphibiansoftheworld.amnh.org/
    structured_sources:
      - https://www.xenbase.org/
      - https://www.ncbi.nlm.nih.gov/datasets/
    literature_sources:
      - https://pubmed.ncbi.nlm.nih.gov/28695290/
    canonical_gene_candidates:
      - UAA
      - UBA
      - UCA
      - UDA
      - UEA
      - DAA
      - DAB
      - DMA
      - TAP1
      - TAP2
      - TAPBP
      - B2M
    observed_structure:
      - runtime_addition: class Ia UAA and UBA, class Ib UCA/UDA/UEA, class IIa DA family, class IIb DMA
      - xenbase_nomenclature: mhc1-uaa, mhc1-uba*, mhc1-uca, mhc1-uda, mhc1-uea, mhc2-daa, mhc2-dab, mhc2-dma
      - diploid_note: X. tropicalis is diploid with simpler gene complement than X. laevis
    notes: >
      Expanded from species-only placeholder to full Xenbase-backed gene
      coverage matching Xela. Gene symbols confirmed via Xenbase gene search
      and NCBI gene records for X. tropicalis MHC loci.

  Sica:
    scientific_name: Sistrurus catenatus
    clade: snake
    ontology_status: runtime_added
    curation_status: active
    ingest_confidence: medium_genome_backed
    recommended_ingest_level: revisit
    taxonomy_sources:
      - https://www.reptile-database.org/
    structured_sources:
      - https://www.ncbi.nlm.nih.gov/datasets/
    literature_sources:
      - https://pubmed.ncbi.nlm.nih.gov/39704347/
    canonical_gene_candidates:
      - DAA
      - DAB
    observed_structure:
      - current_runtime_baseline: class II DAA/DAB only
      - literature_signal: duplicated class I and class IIbeta architecture
    blocked_on:
      - stable comparative snake locus nomenclature
      - accession-backed gene labels suitable for runtime aliases
    notes: >
      Already in runtime with DAA/DAB. Current snake support likely
      under-models real snake MHC architecture. Rattlesnake genome papers
      suggest class I and class IIbeta expansion. The blockers above apply
      to expanding beyond the current DAA/DAB baseline, not to the existing
      runtime entry.

  Anca:
    scientific_name: Anolis carolinensis
    clade: lizard
    ontology_status: runtime_added_species_only
    curation_status: active
    ingest_confidence: medium_genome_backed
    recommended_ingest_level: species
    taxonomy_sources:
      - https://www.reptile-database.org/
    structured_sources:
      - https://www.ncbi.nlm.nih.gov/datasets/
    literature_sources:
      - https://pubmed.ncbi.nlm.nih.gov/36425073/
      - https://pubmed.ncbi.nlm.nih.gov/23343042/
    representative_annotation_sources:
      - https://www.ncbi.nlm.nih.gov/gene/103282626
    candidate_gene_families:
      - class I
      - class II
      - TAP1
      - TAP2
      - TAPBP
      - B2M
    observed_structure:
      - core MHC region on chromosome 2
      - two mhc2beta homologs reported, one lacking exon 2
    ambiguities:
      - >
        The 2022 squamate MHC paper identifies mhc1 and mhc2beta homologs, but
        labels homologs sequentially within the paper rather than proposing a
        stable comparative nomenclature.
      - >
        One of two mhc2beta homologs in each anole species is reported to lack
        exon 2, so not every annotated homolog corresponds to an intact
        canonical class IIbeta gene.
      - >
        Current NCBI annotation uses provisional model records such as
        LOC103282626 "major histocompatibility complex class I-related gene
        protein-like" instead of stable community-recognized MHC locus names.
      - >
        The green anole class I-related record has moved from an unplaced
        scaffold in AnoCar2.0 to chromosome 2 in rAnoCar3.1.pri, which is good
        evidence of improving assemblies but also a reason to avoid freezing
        runtime gene symbols too early.
    notes: >
      Already in runtime as species-only placeholder (no genes). Best first
      lizard pilot because two Anolis genomes define a core MHC region and
      associated framework genes. The blockers above apply to adding gene-
      level ontology, not to the existing species entry.

  Ansa:
    scientific_name: Anolis sagrei
    clade: lizard
    ontology_status: runtime_added_species_only
    curation_status: active
    ingest_confidence: medium_genome_backed
    recommended_ingest_level: species
    taxonomy_sources:
      - https://www.reptile-database.org/
    structured_sources:
      - https://www.ncbi.nlm.nih.gov/datasets/
    literature_sources:
      - https://pubmed.ncbi.nlm.nih.gov/36425073/
    representative_annotation_sources:
      - https://www.ncbi.nlm.nih.gov/gene/132766334
    candidate_gene_families:
      - class I
      - class II
      - TAP1
      - TAP2
      - TAPBP
      - B2M
    observed_structure:
      - core MHC region on chromosome 2
      - two mhc2beta homologs reported, one lacking exon 2
    ambiguities:
      - >
        The same 2022 Anolis paper provides strong evidence for a core MHC
        region on chromosome 2, but it does not establish a stable allele or
        locus naming system suitable for direct mhcgnomes runtime ingestion.
      - >
        NCBI currently exposes model records such as LOC132766334 "RLA class II
        histocompatibility antigen, DP alpha-1 chain-like", which are clearly
        homology-derived labels rather than a settled Anolis nomenclature.
      - >
        The brown anole assembly is newer than the green anole reference work,
        so annotations are improving quickly and may still shift as assemblies
        and models stabilize.
    notes: >
      Already in runtime as species-only placeholder (no genes). Companion
      Anolis pilot species from the same genome-backed study. The blockers
      above apply to adding gene-level ontology, not to the existing
      species entry.

  Acar:
    scientific_name: Acrocephalus arundinaceus
    clade: bird
    ontology_status: runtime_added
    curation_status: active
    ingest_confidence: high_gene_level
    recommended_ingest_level: gene
    structured_sources:
      - https://db.cngb.org/data_resources/protein/A0A0S2N036
    literature_sources:
      - https://pubmed.ncbi.nlm.nih.gov/37483599/
    canonical_gene_candidates:
      - UA
    observed_structure:
      - runtime_addition: family-level class I gene UA
      - literature_signal: duplicated passerine class I architecture exists beyond one locus
    ambiguities:
      - >
        Runtime support is intentionally conservative at the family-label level
        used in external protein resources. This does not claim that UA is the
        only or final canonical class I locus name for this species.
    notes: >
      Added to runtime because current external data uses the exact gene label
      Acar-UA. Broader passerine class I locus curation still needs review.

  Acsc:
    scientific_name: Acrocephalus schoenobaenus
    clade: bird
    ontology_status: runtime_added
    curation_status: active
    ingest_confidence: high_gene_level
    recommended_ingest_level: gene
    structured_sources:
      - https://db.cngb.org/data_resources/protein/A0A1D9C287
    literature_sources:
      - https://academic.oup.com/jhered/article-abstract/101/4/448/905870
    canonical_gene_candidates:
      - UA
    observed_structure:
      - runtime_addition: family-level class I gene UA
      - literature_signal: passerine MHC class I is highly duplicated and fast-evolving
    ambiguities:
      - >
        The runtime UA label follows the concrete external string Acsc-UA and
        should be treated as family-level nomenclature rather than a completed
        locus catalog.
    notes: >
      Added to runtime because current external data uses the exact gene label
      Acsc-UA. This should not block future refinement to more specific loci.

  Getr:
    scientific_name: Geothlypis trichas
    clade: bird
    ontology_status: runtime_added_with_registry_holdback
    curation_status: active
    ingest_confidence: high_gene_level
    recommended_ingest_level: gene
    structured_sources:
      - https://db.cngb.org/data_resources/protein/I7EHM1
      - https://www.uniprot.org/uniprotkb/I7EF30/entry
    literature_sources:
      - https://academic.oup.com/jhered/article-abstract/101/4/448/905870
    canonical_gene_candidates:
      - DAB
    ambiguities:
      - >
        External resources also expose Getr-MHC as a generic class I token, but
        that string does not identify a stable canonical gene family or locus.
        Runtime support therefore adds only Getr-DAB.
    blocked_on:
      - stable canonical destination for generic Getr-MHC labels
    notes: >
      Added Getr-DAB to runtime because it names a specific class II beta
      family. Getr-MHC stays registry-only until it maps cleanly to a gene.

  Paol:
    scientific_name: Paralichthys olivaceus
    clade: fish
    ontology_status: runtime_added
    curation_status: active
    ingest_confidence: high_gene_level
    recommended_ingest_level: gene
    structured_sources:
      - https://www.uniprot.org/uniprotkb/Q6BFC9/entry
      - https://www.uniprot.org/uniprotkb/Q32L55/entry
    literature_sources:
      - https://www.jstage.jst.go.jp/article/fishsci1994/70/2/70_2_264/_article
      - https://pubmed.ncbi.nlm.nih.gov/16874444/
    canonical_gene_candidates:
      - Ia1
      - Ia2
      - DAA
      - DAB
    notes: >
      Runtime captures the exact gene labels used across protein resources and
      Japanese flounder MHC literature: two class I alpha genes and one DA
      class II alpha/beta pair.

  Cyse:
    scientific_name: Cynoglossus semilaevis
    clade: fish
    ontology_status: runtime_added
    curation_status: active
    ingest_confidence: high_gene_level
    recommended_ingest_level: gene
    literature_sources:
      - https://pubmed.ncbi.nlm.nih.gov/30341571/
      - https://bmcgenomdata.biomedcentral.com/articles/10.1186/1471-2156-12-78
    canonical_gene_candidates:
      - DAA
      - DAB
      - DBA
      - DBB
    observed_structure:
      - duplicated class II alpha/beta gene pairs at DA and DB
    notes: >
      Runtime captures the duplicated DA and DB class II gene families reported
      for Chinese tongue sole.

  Epco:
    scientific_name: Epinephelus coioides
    clade: fish
    ontology_status: runtime_added
    curation_status: active
    ingest_confidence: high_gene_level
    recommended_ingest_level: gene
    literature_sources:
      - https://www.sciencedirect.com/science/article/abs/pii/S209592731630130X
      - https://www.sciencedirect.com/science/article/abs/pii/S0044848616302113
    canonical_gene_candidates:
      - DAA
      - DAB
      - DBB
    ambiguities:
      - >
        Runtime adds only the gene families supported directly in the current
        sources. It does not infer an Epco-DBA gene without a citation.
    notes: >
      Orange-spotted grouper currently has source support for DAA, DAB, and DBB
      and those are the only class II genes added to runtime.

  Dare:
    scientific_name: Danio rerio
    clade: fish
    ontology_status: runtime_added
    curation_status: active
    ingest_confidence: high_gene_level
    recommended_ingest_level: gene
    structured_sources:
      - https://zfin.org/ZDB-GENE-990415-145
    literature_sources:
      - https://pubmed.ncbi.nlm.nih.gov/7607709/
    canonical_gene_candidates:
      - UBA
    notes: >
      Runtime adds only the zebrafish class I UBA family because it is a named
      gene in ZFIN and longstanding zebrafish MHC class I literature. Broader
      zebrafish MHC family names seen in external datasets still need review.

  Cyca:
    scientific_name: Cyprinus carpio
    clade: fish
    ontology_status: runtime_added_with_alias_gap
    curation_status: active
    ingest_confidence: medium_gene_level
    recommended_ingest_level: gene_family
    literature_sources:
      - https://pubmed.ncbi.nlm.nih.gov/12165519/
      - https://pubmed.ncbi.nlm.nih.gov/15864912/
      - https://pubmed.ncbi.nlm.nih.gov/18817879/
      - https://pubmed.ncbi.nlm.nih.gov/8613142/
    canonical_gene_candidates:
      - UA
      - ZE
      - DXA
      - DAB
      - B2M
    observed_structure:
      - runtime_addition: family-level UA / ZE / DXA / DAB support for common carp
      - external_aliases_seen: UA1, DXA1, DXA2, DAB1, DAB2, DAB3, DAB4
    ambiguities:
      - >
        The carp literature and external sequence sets use numbered family
        members, but the current runtime ontology intentionally normalizes
        them to conservative family-level genes instead of claiming each number
        is a stable cross-study locus.
    blocked_on:
      - accession-backed decision on whether numbered Cyca labels should become distinct loci
    notes: >
      Runtime adds common carp as conservative family-level support and handles
      the numbered Cyca variants seen by mhcseqs through species-local aliases.

  Orni:
    scientific_name: Oreochromis niloticus
    clade: fish
    ontology_status: runtime_added
    curation_status: active
    ingest_confidence: high_gene_level
    recommended_ingest_level: gene
    literature_sources:
      - https://pubmed.ncbi.nlm.nih.gov/30345515/
      - https://pubmed.ncbi.nlm.nih.gov/31187732/
    canonical_gene_candidates:
      - DAA
      - DAB
    observed_structure:
      - runtime_addition: class II alpha/beta DA family for Nile tilapia
    notes: >
      Runtime follows the exact Orni-DAA and Orni-DAB allele naming used in the
      published tilapia resistance studies.

  Satr:
    scientific_name: Salmo trutta
    clade: fish
    ontology_status: runtime_added_with_registry_holdback
    curation_status: active
    ingest_confidence: medium_gene_level
    recommended_ingest_level: gene
    literature_sources:
      - https://pubmed.ncbi.nlm.nih.gov/11207285/
    canonical_gene_candidates:
      - UBA
      - DAB
    ambiguities:
      - >
        The current source trail supports brown trout UBA and DAB explicitly,
        but does not yet justify adding Satr-DAA or other broader salmonid
        labels surfaced by mhcseqs.
    blocked_on:
      - accession-backed confirmation for any Satr genes beyond UBA and DAB
    notes: >
      Runtime adds the clearly named classical class I UBA family and class II
      DAB family only.

  Trov:
    scientific_name: Trachinotus ovatus
    clade: fish
    ontology_status: runtime_added
    curation_status: active
    ingest_confidence: medium_gene_level
    recommended_ingest_level: gene
    literature_sources:
      - https://pubmed.ncbi.nlm.nih.gov/28554837/
      - https://pubmed.ncbi.nlm.nih.gov/29902561/
    canonical_gene_candidates:
      - UBA
      - DAA
      - DAB
    observed_structure:
      - runtime_addition: class I UBA and class II DA family (DAA, DAB)
    notes: >
      Golden pompano added from mhcseqs error report data and now anchored to
      species-specific class I / class II characterization papers above. Gene
      set follows the standard teleost pattern.

  Chpi:
    scientific_name: Chrysolophus pictus
    clade: bird
    ontology_status: runtime_added
    curation_status: active
    ingest_confidence: high_gene_level
    recommended_ingest_level: gene
    literature_sources:
      - https://pubmed.ncbi.nlm.nih.gov/26700854/
    canonical_gene_candidates:
      - IA1
      - IA2
      - IA3
    observed_structure:
      - runtime_addition: IA1 and IA2 as classical class I genes
      - runtime_addition: IA3 as nonclassical class I gene
    notes: >
      Runtime adds the three named golden pheasant class I loci reported in the
      locus-characterization paper, including the user-requested IA2. The same
      paper explicitly distinguishes IA1 and IA2 as classical loci and IA3 as
      a nonclassical class I gene, which is why IA3 is mapped to Ib.

  Coja:
    scientific_name: Coturnix japonica
    clade: bird
    ontology_status: runtime_added_with_registry_holdback
    curation_status: active
    ingest_confidence: high_gene_level
    recommended_ingest_level: gene
    literature_sources:
      - https://www.ncbi.nlm.nih.gov/pmc/articles/PMC1769493/
      - https://pubmed.ncbi.nlm.nih.gov/15258705/
    canonical_gene_candidates:
      - DAB1
      - DBB1
      - DCB1
      - DDB1
      - DEB1
      - DFB1
      - DGB1
    ambiguities:
      - >
        The paper also contains study-local II-xx labels. Those strings are
        held back because they are not cleanly tied to a stable gene family.
      - >
        Additional DM-family names in external datasets need separate source
        review before they enter runtime ontology.
      - >
        Coja-DDB1 appears as a named locus in the quail paper and is now
        runtime-enabled as a class II beta gene on naming-pattern and locus
        context grounds, but the direct allele-level support is still weaker
        than for the other D?B1 loci in the same dataset.
    blocked_on:
      - canonical mapping for Coja-II-13, Coja-II-16, and Coja-II-17
      - validation of any Coja DMA/DMB family names not directly curated here
      - stronger allele-level confirmation for runtime-added Coja-DDB1
    notes: >
      Runtime adds the explicitly named quail class II beta loci from the
      structural-flexibility paper, including Coja-DDB1. DDB1 remains tagged
      here as follow-up curation debt because the present source trail is
      strong enough for gene-level runtime support, but still weaker than the
      other named D?B1 loci for allele-level confidence.

  Fuat:
    scientific_name: Fulica atra
    clade: bird
    ontology_status: runtime_added
    curation_status: active
    ingest_confidence: high_gene_level
    recommended_ingest_level: gene
    literature_sources:
      - https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3967895/
    canonical_gene_candidates:
      - DAB
    notes: >
      Runtime follows the exact Fuat-DAB nomenclature used in the Eurasian coot
      MHC class II B diversity study.

  Sthi:
    scientific_name: Sterna hirundo
    clade: bird
    ontology_status: runtime_added
    curation_status: active
    ingest_confidence: medium_gene_level
    recommended_ingest_level: gene_family
    literature_sources:
      - https://pubmed.ncbi.nlm.nih.gov/32550188/
      - https://pubmed.ncbi.nlm.nih.gov/22005308/
    canonical_gene_candidates:
      - UA
      - DAB
    observed_structure:
      - runtime_addition: family-level class I UA and class II beta DAB support
    ambiguities:
      - >
        The common tern sources support class I and class II family diversity
        but do not justify a finer locus split than the external UA / DAB
        labels currently used by mhcseqs.
    notes: >
      Runtime adds common tern using conservative family-level class I and
      class II labels rather than inferring locus-specific names.

  Sphu:
    scientific_name: Spheniscus humboldti
    clade: bird
    ontology_status: runtime_added
    curation_status: active
    ingest_confidence: medium_gene_level
    recommended_ingest_level: gene
    literature_sources:
      - https://pubmed.ncbi.nlm.nih.gov/15714307/
    canonical_gene_candidates:
      - DRB1
    observed_structure:
      - runtime_addition: DRB1-like class II beta family
    notes: >
      Runtime adopts DRB1 as a family-level bird class II beta name because the
      published Humboldt penguin locus is described as DRB1-like throughout.

  Spma:
    scientific_name: Spheniscus magellanicus
    clade: bird
    ontology_status: runtime_added
    curation_status: active
    ingest_confidence: medium_gene_level
    recommended_ingest_level: gene
    literature_sources:
      - https://pubmed.ncbi.nlm.nih.gov/19319519/
    canonical_gene_candidates:
      - DRB1
    observed_structure:
      - runtime_addition: DRB1-like class II beta family in banded penguins
    ambiguities:
      - >
        The supporting paper is genus-wide rather than a dedicated Magellanic
        penguin locus paper, so this should be treated as family-level support.
    notes: >
      Runtime adds Spma-DRB1 conservatively as a DRB1-like family label.

  Saal:
    scientific_name: Salvelinus alpinus
    clade: fish
    ontology_status: runtime_added
    curation_status: active
    ingest_confidence: medium_gene_level
    recommended_ingest_level: gene
    structured_sources:
      - https://db.cngb.org/data_resources/protein/Q90WJ7
    literature_sources:
      - https://pubmed.ncbi.nlm.nih.gov/28343337/
    canonical_gene_candidates:
      - UBA
      - UEA
      - UGA
      - DAB
    notes: >
      Added to runtime with salmonid-standard class I (UBA, UEA, UGA) and
      class II (DAB) gene families. Gene symbols follow the same pattern as
      other salmonids (Onmy, Sasa, Satr).

  Ritr:
    scientific_name: Rissa tridactyla
    clade: bird
    ontology_status: registry_only
    curation_status: blocked
    ingest_confidence: low_alias_only
    recommended_ingest_level: revisit
    literature_sources:
      - https://pubmed.ncbi.nlm.nih.gov/40874768/
      - https://pubmed.ncbi.nlm.nih.gov/40795975/
    candidate_gene_families:
      - DRB1
    ambiguities:
      - >
        Current source support establishes black-legged kittiwake MHC class II
        beta diversity, but not a clean species-local DRB1 family name.
    blocked_on:
      - source that ties Ritr directly to DRB1 rather than generic MHC-IIB
    notes: >
      Keep Ritr out of runtime until the DRB1 naming in mhcseqs is validated.

  Otel:
    scientific_name: Otus elegans
    clade: bird
    ontology_status: registry_only
    curation_status: blocked
    ingest_confidence: low_alias_only
    recommended_ingest_level: revisit
    literature_sources:
      - https://pubmed.ncbi.nlm.nih.gov/32281698/
    candidate_gene_families:
      - DAB
    ambiguities:
      - >
        Owl MHC work supports class II beta diversity, but the current source
        trail does not yet anchor Otel to a stable DAB family name.
    blocked_on:
      - exact Otel-DAB nomenclature support
    notes: >
      Leave Otel registry-only until a source-backed DAB naming convention is
      confirmed for Ryukyu scops owl.

  Tyal:
    scientific_name: Tyto alba
    clade: bird
    ontology_status: runtime_added_with_alias_gap
    curation_status: active
    ingest_confidence: medium_gene_level
    recommended_ingest_level: alias_review
    literature_sources:
      - https://pubmed.ncbi.nlm.nih.gov/27176619/
      - https://academic.oup.com/mbe/article/25/6/1180/1133247
    observed_structure:
      - existing_runtime_support: DAB1, DAB2
      - runtime_addition: family-level UA and DAB support
      - external_aliases_seen: MhcTyal-DAB1, MhcTyal-DAB2, MHCIIB, DRB
    ambiguities:
      - >
        Barn owl class I nomenclature is still family-level in runtime because
        the available source trail does not justify committing to a finer class
        I locus split than UA.
    blocked_on:
      - validation of any barn owl class I names beyond the generic UA family
    notes: >
